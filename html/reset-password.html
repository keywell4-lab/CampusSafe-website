
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CampusSafe</title>

    <link rel="stylesheet" href="../css/style.css">

    <script type="module" src="../js/reset-password.js"></script>
</head>

<body>

    <header>
        <nav>
            <a href="login.html" class="logo">
                Campus<span>Safe</span>
            </a>

            <a href="login.html">Log In</a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="auth-container">

        <section id="resetSection">

            <h1>Reset Your Password</h1>

            <p class="auth-description">
                Enter a new password for your CampusSafe account.
            </p>

            <form id="resetPasswordForm" class="auth-form">

                <div>
                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div>
                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">
                    Update Password
                </button>

            </form>

            <p
                id="resetMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

        </section>

    </main>

</body>
</html>
