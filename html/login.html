<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | CampusSafe</title>

    <link rel="stylesheet" href="../css/style.css">

       <!-- Authentication logic will be added here -->
    <script type="module" src="../js/auth.js" ></script>

</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">


            <img src="https://i.ibb.co/WWnf8pVp/Murang-a-University-of-Technology.png" alt="MUT logo">
                Campus<span>Safe</span>
            </a>

            <a href="index.html">Home</a>

            <a href="lost-found.html">Lost &amp; Found</a>

            <a href="emergency.html">Emergency</a>

            <a href="#signupSection" id="navSignup">Sign Up</a>
        </nav>
    </header>

    <main class="auth-container">

        <!-- LOGIN FORM -->
        <section id="loginSection">

            <h1>Welcome Back</h1>

            <p class="auth-description">
                Log in to your CampusSafe account.
            </p>

            <form id="loginForm" class="auth-form">

                <div>
                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    Log In
                </button>

            </form>
            
            <p class="auth-switch">
                <button type="button" id="forgotPasswordBtn">
                    Forgot Password?
                </button>
            </p>

            <p class="auth-switch">
                Don't have an account?

                <button type="button" id="showSignup">
                    Create Account
                </button>
            </p>

        </section>


        <!-- REGISTRATION FORM -->
        <section id="signupSection" hidden>

            <h1>Create Account</h1>

            <p class="auth-description">
                Join CampusSafe to submit reports
                and claim lost items.
            </p>

            <form id="signupForm" class="auth-form">

                <div>
                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="signupPassword">
                        Create Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?

                <button type="button" id="showLogin">
                    Log In
                </button>
            </p>

        </section>

        <!-- Messages appear here -->
        <p
            id="authMessage"
            class="auth-message"
            role="status"
            aria-live="polite"
        ></p>

    </main>

 

</body>
</html>
